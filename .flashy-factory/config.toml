version = 1
poll_every = "30s"
pull_request_reconcile_every = "60s"

[worker]
runtime = "codex"
sandbox = "worktree"
timeout = "2h"
maximum_timeout = "8h"
max_concurrent = 1

[source]
command = [".flashy-factory/sources/asana", "--max-results", "200"]

[agent_profile.specification]
model = "gpt-5.3-codex"
reasoning_effort = "high"
service_tier = "priority"

[agent_profile.implementation]
model = "gpt-5.3-codex"
reasoning_effort = "xhigh"
service_tier = "priority"

[trigger.triage]
type = "source"
state = "Ready For Spec"
labels = ["factory:auto-to-pr"]
workflow = ".flashy-factory/workflows/triage.md"
agent_profile = "specification"

[trigger.triage-manual]
type = "source"
state = "Ready For Spec"
labels = ["factory:manual"]
workflow = ".flashy-factory/workflows/triage.md"
agent_profile = "specification"

[trigger.implement]
type = "source"
state = "Ready To Implement"
labels = ["factory:auto-to-pr"]
workflow = ".flashy-factory/workflows/implement.md"
timeout = "4h"
agent_profile = "implementation"

[trigger.reconcile-dependencies]
type = "source"
state = "Approved - Waiting On Dependencies"
labels = ["factory:auto-to-pr"]
workflow = ".flashy-factory/workflows/reconcile-dependencies.md"
agent_profile = "specification"

[trigger.implement-manual]
type = "source"
state = "Ready To Implement"
labels = ["factory:manual"]
workflow = ".flashy-factory/workflows/implement.md"
timeout = "4h"
agent_profile = "implementation"

[trigger.classify-tickets]
type = "schedule"
schedule = "0 8 * * *"
timezone = "Europe/London"
workflow = ".flashy-factory/workflows/classify-tickets.md"
timeout = "2h"
agent_profile = "specification"

[trigger.bug-finder]
type = "schedule"
schedule = "0 9 * * 1"
timezone = "Europe/London"
workflow = ".flashy-factory/workflows/bug-finder.md"
timeout = "2h"
agent_profile = "specification"
