# Copy the Jira workflow examples into .flashy-factory/workflows, copy the source and
# trigger tables into .flashy-factory/config.toml, then adapt the project key, Jira
# state names, and label.
version = 1
poll_every = "30s"

[worker]
runtime = "codex"
sandbox = "worktree"
timeout = "2h"
maximum_timeout = "8h"
max_concurrent = 2

[source]
command = [
  ".flashy-factory/sources/jira",
  "--project", "SPS",
  "--max-results", "100",
]

[agent_profile.specification]
model = "gpt-5.6-terra"
reasoning_effort = "low"
service_tier = "default"

[agent_profile.implementation]
model = "gpt-5.6-terra"
reasoning_effort = "medium"
service_tier = "default"

[trigger.triage]
type = "source"
state = "Ready For Spec"
labels = ["factory-ready"]
workflow = ".flashy-factory/workflows/jira-triage.md"
agent_profile = "specification"

[trigger.implement]
type = "source"
state = "Ready To Implement"
labels = ["factory-ready"]
workflow = ".flashy-factory/workflows/jira-implement.md"
timeout = "4h"
agent_profile = "implementation"
